plugins {
  id 'com.android.library'
  // expo-module-gradle-plugin applies the Kotlin plugin at the Expo-managed
  // version (driven by `android.kotlinVersion`). Do NOT also apply
  // `org.jetbrains.kotlin.android` here — it pins a different (default) Kotlin
  // compiler and breaks reading ArcGIS's 2.3.0 metadata.
  id 'expo-module-gradle-plugin'
  // The ArcGIS Maps SDK for Kotlin Toolkit scale bar is a Jetpack Compose
  // component, so this module compiles Compose. The Compose compiler plugin is
  // versioned in lockstep with Kotlin; keep it equal to ANDROID_KOTLIN_VERSION.
  id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
}

group = 'expo.modules.arcgismapssdk'
version = '0.1.0'

// Esri's Maven repository hosts the ArcGIS Maps SDK for Kotlin. The config
// plugin (Phase 3) is responsible for adding this to the *consumer* project so
// autolinking resolves it; it is declared here as well so this module resolves
// when built directly. Keep the two in sync.
repositories {
  maven { url 'https://esri.jfrog.io/artifactory/arcgis' }
}

android {
  namespace "expo.modules.arcgismapssdk"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // ArcGIS Maps SDK 300.0 requires a minimum of API 28.
    minSdkVersion 28
  }
  buildFeatures {
    // Required to host the Toolkit's Compose scale bar in a ComposeView overlay.
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Pinned exactly per CLAUDE.md native dependency policy — no ranges, no `+`.
  // Maven group is `com.esri`; the Kotlin package namespace is `com.arcgismaps`.
  implementation 'com.esri:arcgis-maps-kotlin:300.0.0'

  // ArcGIS Maps SDK for Kotlin Toolkit — scale bar (Compose). The toolkit BOM
  // pins the component + its Compose dependency versions to the 300.0 release.
  implementation platform('com.esri:arcgis-maps-kotlin-toolkit-bom:300.0.0')
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-scalebar'

  // ArcGIS Maps SDK for Kotlin Toolkit — Augmented Reality scene views
  // (WorldScale / TableTop / Flyover). Version pinned by the toolkit BOM above.
  implementation 'com.esri:arcgis-maps-kotlin-toolkit-ar'
  // Google's ARCore. The toolkit pulls it in at runtime only, so it is declared
  // directly here (pinned, per CLAUDE.md policy) for the capability probe
  // (`ArCoreApk`) to compile. Kept in lockstep with the toolkit's 300.0 release.
  implementation 'com.google.ar:core:1.52.0'

  // Compose runtime needed to embed the composable via ComposeView.
  implementation platform('androidx.compose:compose-bom:2025.11.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'

  testImplementation 'junit:junit:4.13.2'
}
