name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks (yarn check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build config plugin
        run: yarn build:plugin

      # Runs the package script (typecheck x2, lint, prettier, jest).
      # `yarn run check`, not `yarn check` — the latter is Yarn 1's builtin.
      - name: Run checks
        run: yarn run check

# ---------------------------------------------------------------------------
# Native builds are intentionally NOT run here. They require the ArcGIS Maps SDK
# 300.0 (Android: Esri Maven; iOS: the ArcGIS Swift Package added manually), plus
# an Android SDK 36 / Xcode 26 toolchain. Add these jobs once a runner with those
