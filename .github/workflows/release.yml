name: Release

# Publishes to npm only when a version tag is pushed (e.g. `v0.1.0`). Nothing is
# published on ordinary pushes or PRs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build config plugin
        run: yarn build:plugin

      # typecheck (x2) + lint + prettier + jest. `prepublishOnly` re-runs this as
      # a local safety net, but failing here stops the job before publish.
      - name: Static checks
        run: yarn run check

      - name: Verify the tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # `prepare` rebuilds build/ and plugin/build before packing; `--provenance`
      # attaches a signed provenance statement (requires id-token: write above).
      - name: Publish (public, with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
